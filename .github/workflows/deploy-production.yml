name: Lab Frontend - Production Deploy

# Push to main -> build in GitHub Actions -> upload dist to EC2 -> atomic swap
# of the Nginx web root (/var/www/litmus/lab/dist). The previous build is kept
# at dist.prev for one-command rollback.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: lab-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to lab.litmuslabs.in
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      WEB_ROOT: /var/www/litmus/lab

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::Variable VITE_API_URL (production environment) is not set"; exit 1; }
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }

      - name: Package Build Output
        run: tar -czf lab-dist.tar.gz -C dist .

      - name: Upload Bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: lab-dist.tar.gz
          target: /tmp/lab-upload-${{ github.sha }}

      - name: Swap Nginx Web Root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            UPLOAD_DIR=/tmp/lab-upload-${{ github.sha }}
            cd ${{ env.WEB_ROOT }}
            sudo rm -rf dist.new
            sudo mkdir -p dist.new
            sudo tar -xzf $UPLOAD_DIR/lab-dist.tar.gz -C dist.new
            sudo chown -R www-data:www-data dist.new
            sudo chmod -R 755 dist.new
            # Atomic swap: keep the current build as dist.prev for rollback
            sudo rm -rf dist.prev
            if [ -d dist ]; then sudo mv dist dist.prev; fi
            sudo mv dist.new dist
            rm -rf $UPLOAD_DIR
            echo "Deployed ${{ github.sha }} to ${{ env.WEB_ROOT }}/dist"

      - name: Smoke Test
        run: |
          sleep 3
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://lab.litmuslabs.in/
